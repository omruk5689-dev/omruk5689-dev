    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="0.55" stop-color="#56d4dd"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <clipPath id="card"><rect width="588" height="466" rx="16"/></clipPath>
  </defs>
  <style>
    .bin-zeros { animation: dataPulse 7s ease-in-out infinite; }
    @keyframes dataPulse { 0%, 100% { opacity: .42; } 50% { opacity: .68; } }
    .bin-ones { animation: dataFlicker 9s ease-in-out infinite; }
    @keyframes dataFlicker { 0%, 100% { opacity: 1; } 48% { opacity: .86; } 52% { opacity: 1; } }
    .bin-cursor { animation: cursorBlink 1.1s steps(1) infinite; }
    @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bin-zeros, .bin-ones, .bin-cursor { animation: none; }
    }
  </style>
