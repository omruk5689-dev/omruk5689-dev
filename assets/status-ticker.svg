<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40" aria-hidden="true">
  <defs>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".08" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="tickerMask"><rect width="900" height="40" fill="url(#edgeFade)"/></mask>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset=".2" stop-color="#2ea043" stop-opacity=".45"/>
      <stop offset=".8" stop-color="#2ea043" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ticker { animation: scroll 18s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    @media (prefers-reduced-motion: reduce) {
      .ticker { animation: none; }
    }
  </style>
  <line x1="0" y1="2" x2="900" y2="2" stroke="url(#rail)" stroke-width="1"/>
  <line x1="0" y1="38" x2="900" y2="38" stroke="url(#rail)" stroke-width="1"/>
  <g mask="url(#tickerMask)">
    <g class="ticker">
      <text x="0" y="26" textLength="900" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#39d353">DESIGNING · SOLDERING · DEBUGGING · FLASHING · TESTING · REPEATING · </text>
      <text x="900" y="26" textLength="900" lengthAdjust="spacingAndGlyphs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#39d353">DESIGNING · SOLDERING · DEBUGGING · FLASHING · TESTING · REPEATING · </text>
    </g>
  </g>
</svg>
