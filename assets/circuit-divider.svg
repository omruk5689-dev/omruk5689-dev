<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" aria-hidden="true">
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset=".16" stop-color="#2ea043" stop-opacity=".55"/>
      <stop offset=".84" stop-color="#2ea043" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7ee787" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .spark { animation: travel 4.5s linear infinite; }
    @keyframes travel { from { transform: translateX(-180px); } to { transform: translateX(900px); } }
    .node { animation: nodePulse 3s ease-in-out infinite; }
    @keyframes nodePulse { 0%, 100% { opacity: .25; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) {
      .spark, .node { animation: none; }
      .spark { opacity: .35; }
    }
  </style>
  <line x1="0" y1="14" x2="900" y2="14" stroke="url(#trace)" stroke-width="1.5"/>
  <rect class="spark" x="0" y="12" width="180" height="4" rx="2" fill="url(#spark)"/>
  <circle cx="150" cy="14" r="3" fill="#0d1117" stroke="#2ea043" stroke-opacity=".8"/>
  <circle cx="450" cy="14" r="4" fill="#0d1117" stroke="#7ee787" stroke-opacity=".8"/>
  <circle class="node" cx="450" cy="14" r="9" fill="none" stroke="#7ee787" stroke-opacity=".45"/>
  <circle cx="750" cy="14" r="3" fill="#0d1117" stroke="#2ea043" stroke-opacity=".8"/>
</svg>
